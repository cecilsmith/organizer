[package]
name = "organizer"
version = "0.1.0"
description = "Apple Reminders + GitHub issues, organized by area"
authors = ["Nathanael Smith"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dirs = "7.0.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "native-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-graphics = { version = "0.3.2", features = ["CGColor"] }
objc2-event-kit = { version = "0.3.2", features = ["EKCalendar", "EKCalendarItem", "EKReminder", "EKEventStore", "EKTypes", "EKSource", "EKObject", "EKAlarm", "block2", "objc2-core-graphics"] }
objc2-foundation = "0.3.2"
security-framework = "3.7.0"
